org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=false
# ABIs to build: arm64-v8a (phones) by default; add x86_64 for the emulator:
#   gradlew assembleDebug -Pabis=arm64-v8a,x86_64
abis=arm64-v8a
# Where the Sonic Origins sprites pack (origins.bin, origins_ufo.bin) is taken
# from, relative to android/: a release stage, or a PC build
originsDir=../build/Release
